<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureChain AI Smart Contract Auditor V2.0 - Enhanced</title>
    <style>
        /* CSS Variables for a clean, consistent neon theme */
        :root {
            --bg-dark: #0d0d2b;
            --bg-inner: #181a2b;
            --color-neon-blue: #00f2fe;
            --color-accent-blue: #4facfe;
            --color-critical: #ff4d4d;
            --color-high: #ff8c4d;
            --color-medium: #ffae42;
            --color-low: #00e6e6;
            --color-success: #32ff7e;
            --color-text: #e6e6e6;
            --color-shadow-critical: rgba(255, 77, 77, 0.5); /* New critical shadow */
        }

        body {
            background-color: var(--bg-dark);
            color: var(--color-text);
            /* Using a common monospaced font for a hacker look */
            font-family: 'Fira Code', 'Consolas', monospace; 
            padding: 20px;
            min-height: 100vh;
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            margin: 50px auto;
            background: var(--bg-inner);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.3);
            border: 1px solid var(--color-accent-blue);
        }
        h1 {
            color: var(--color-neon-blue);
            margin-bottom: 5px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
        }
        .subtitle {
            text-align: center;
            color: #b3ccff;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        /* --- CODE INPUT & UPLOAD --- */
        .input-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .code-area-wrapper {
            flex-grow: 1;
            display: flex; /* For textarea to fill wrapper */
        }
        .file-upload-box {
            flex-basis: 30%;
            min-width: 250px; /* Ensure upload box has a decent minimum size */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px dashed var(--color-accent-blue);
            border-radius: 8px;
            padding: 15px; /* Increased padding */
            cursor: pointer;
            text-align: center;
            transition: background 0.3s, border-color 0.3s;
            max-height: 150px; /* Adjusted height */
            margin-top: 0;
        }
        .file-upload-box:hover {
            background: rgba(79, 172, 254, 0.1);
            border-color: var(--color-neon-blue);
        }
        .file-upload-box input { display: none; }
        .file-upload-box p {
            margin: 5px 0 0;
            font-size: 0.9em;
            word-break: break-all; /* Prevent overflow of long filenames */
        }
        #fileNameDisplay {
            color: var(--color-low);
            font-size: 0.8em;
            margin-top: 5px;
        }

        textarea {
            flex-grow: 1;
            height: 450px; /* Fixed height moved to textarea for direct control */
            padding: 15px;
            border: 1px solid var(--color-accent-blue);
            background: #121424;
            color: var(--color-text);
            font-family: monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            border-radius: 8px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s, box-shadow 0.3s, opacity 0.3s;
        }
        textarea:focus {
            border-color: var(--color-neon-blue);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            outline: none;
        }
        textarea:disabled {
            opacity: 0.7; /* Dim code area while auditing */
        }
        
        /* Actions Group */
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button {
            background: linear-gradient(90deg, var(--color-neon-blue), var(--color-accent-blue));
            color: var(--bg-dark);
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s, opacity 0.3s;
        }
        button:hover {
            transform: translateY(-3px); /* Slightly more pronounced lift */
            box-shadow: 0 6px 18px rgba(0, 242, 254, 0.7); /* Brighter shadow */
        }
        button:active { /* Added active state feedback */
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(0, 242, 254, 0.5);
        }
        button:disabled {
            opacity: 0.5; /* Dimmer disabled state */
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        #reportButton {
            background: var(--color-high);
            color: var(--bg-dark);
        }

        /* --- RESULT SECTION --- */
        #auditResult {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            min-height: 50px;
            border: 1px solid var(--color-accent-blue);
            background: #121424;
            font-size: 1em;
            text-align: left;
            transition: box-shadow 0.5s ease-in-out; /* For glow effect */
        }

        /* Critical Glow Effect */
        #auditResult.glow-critical {
            box-shadow: 0 0 20px var(--color-shadow-critical), 
                        0 0 10px var(--color-critical);
        }
        
        .result-summary {
            font-weight: bold;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(79, 172, 254, 0.5);
            margin-bottom: 15px;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .result-summary-icon {
            font-size: 1.5em;
            line-height: 1;
        }

        /* Structured Report Table */
        .vulnerability-table {
            width: 100%;
            border-collapse: collapse;
        }
        .vulnerability-table th, .vulnerability-table td {
            padding: 12px 10px; /* Slightly more vertical padding */
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
            font-size: 0.9em;
            vertical-align: top; /* Align cell content to the top */
        }
        .vulnerability-table th {
            color: var(--color-neon-blue);
            background: rgba(0, 242, 254, 0.05);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .vulnerability-table tr:last-child td {
            border-bottom: none; /* Clean up last row */
        }


        /* Severity Colors */
        .CRITICAL { color: var(--color-critical); font-weight: bold; }
        .HIGH { color: var(--color-high); font-weight: bold; }
        .MEDIUM { color: var(--color-medium); }
        .LOW { color: var(--color-low); }

        /* --- PROGRESS BAR --- */
        #progress-bar-container {
            width: 100%;
            background-color: #333;
            border-radius: 5px;
            margin-top: 20px;
            overflow: hidden;
            display: none;
            position: relative;
            border: 1px solid var(--color-accent-blue);
        }
        #progress-bar {
            height: 20px; /* Slightly taller bar */
            width: 0%;
            background: linear-gradient(90deg, var(--color-neon-blue), var(--color-accent-blue));
            transition: width 0.1s linear;
        }
        #progressStatus {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--bg-dark);
            font-weight: bold;
            font-size: 0.9em;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 SecureChain AI Smart Contract Auditor V2.0</h1>
        <p class="subtitle">Leveraging machine learning for static analysis, fuzzing, and pattern matching.</p>
        
        <div class="input-group">
            <div class="code-area-wrapper">
                <textarea id="solidityCode" placeholder="// Paste Solidity code (e.g., ERC-20, NFT contract) here...
// AI will detect Reentrancy, Access Control, Gas, and Standard Compliance issues.
pragma solidity ^0.8.0;

contract MyToken {
    mapping(address => uint) public balances;

    function transfer(address recipient, uint amount) public {
        require(balances[msg.sender] >= amount, 'Insufficient balance');
        balances[msg.sender] -= amount;
        balances[recipient] += amount;
    }
}"></textarea>
            </div>

            <label for="fileUpload" class="file-upload-box">
                <span style="font-size: 2em; color: var(--color-neon-blue);">⬆️</span>
                <p>Upload .sol File to Auto-Scan</p>
                <p id="fileNameDisplay">No file loaded.</p>
                <input type="file" id="fileUpload" accept=".sol" onchange="loadFile(this.files[0])">
            </label>
        </div>
        
        <div class="actions">
            <button id="auditButton" onclick="auditContract()">Execute AI Audit</button>
            <button id="reportButton" disabled onclick="generateReport()">Generate Full Report</button>
        </div>
        
        <div id="progress-bar-container">
            <div id="progress-bar"></div>
            <span id="progressStatus">Initializing...</span>
        </div>

        <div id="auditResult">
            <span style="color: #b3ccff;">Paste or upload a contract and click "Execute AI Audit" to begin scanning.</span>
        </div>
    </div>

    <script>
        const auditButton = document.getElementById('auditButton');
        const reportButton = document.getElementById('reportButton');
        const codeInput = document.getElementById('solidityCode');
        const resultDiv = document.getElementById('auditResult');
        const progressBarContainer = document.getElementById('progress-bar-container');
        const progressBar = document.getElementById('progress-bar');
        const progressStatus = document.getElementById('progressStatus');
        const fileNameDisplay = document.getElementById('fileNameDisplay'); // New element reference

        let interval;
        let findings = [];
        let isAuditing = false; // New state variable

        /**
         * Starts the progress bar and updates status messages.
         * @param {string[]} stages - Array of strings for the different scanning phases.
         */
        function startProgress(stages) {
            isAuditing = true;
            auditButton.disabled = true;
            reportButton.disabled = true;
            codeInput.disabled = true; // Disable code input during audit

            progressBarContainer.style.display = 'block';
            progressBar.style.width = '0%';
            resultDiv.classList.remove('glow-critical'); // Reset glow
            let width = 0;
            let currentStage = -1;
            const totalDuration = 3500; // Slightly longer duration for a more realistic feel
            const stageProgressIncrement = 100 / stages.length;

            interval = setInterval(() => {
                // Slower increment to match the 3.5s duration
                width += (100 / (totalDuration / 20)); 

                if (width >= 100) {
                    clearInterval(interval);
                    progressStatus.textContent = 'Report Generation...';
                } else {
                    progressBar.style.width = width + '%';
                    
                    // Update stage based on progress
                    const stageIndex = Math.min(stages.length - 1, Math.floor(width / stageProgressIncrement));
                    if (currentStage !== stageIndex) {
                        currentStage = stageIndex;
                        progressStatus.textContent = stages[currentStage];
                    }
                }
            }, 20);
        }

        function stopProgress() {
            isAuditing = false;
            clearInterval(interval);
            progressBar.style.width = '100%';
            progressStatus.textContent = 'Audit Complete';
            
            // Re-enable controls after a slight delay
            setTimeout(() => {
                progressBarContainer.style.display = 'none';
                progressStatus.textContent = 'Initializing...';
                auditButton.disabled = false;
                codeInput.disabled = false;
                if (findings.length > 0) {
                    reportButton.disabled = false;
                }
            }, 500);
        }

        /**
         * Handles file upload, loads content, and automatically starts the audit.
         * @param {File} file - The file object loaded from the input.
         */
        function loadFile(file) {
            if (file) {
                fileNameDisplay.textContent = `File: ${file.name}`; // Show file name
                const reader = new FileReader();
                reader.onload = (e) => {
                    codeInput.value = e.target.result;
                    resultDiv.innerHTML = `<span style="color: var(--color-low);">File **"${file.name}"** loaded successfully. Starting automatic audit...</span>`;
                    // Automatically execute audit after loading
                    auditContract(); 
                };
                reader.readAsText(file);
            } else {
                 fileNameDisplay.textContent = 'No file loaded.';
            }
            document.getElementById('fileUpload').value = ''; // Reset input to allow reloading same file
        }

        /**
         * Finds the line number for a given pattern in the code.
         * @param {string} code - The full Solidity code string.
         * @param {string} pattern - The snippet to search for.
         * @returns {number|string} The line number (1-indexed) or 'N/A'.
         */
        function getLineNumber(code, pattern) {
            const lines = code.split('\n');
            for(let i = 0; i < lines.length; i++) {
                if(lines[i].includes(pattern)) {
                    return i + 1;
                }
            }
            return 'N/A';
        }

        function auditContract() {
            if (isAuditing) return; // Prevent multiple audits

            const code = codeInput.value;
            findings = [];

            if (!code.trim()) {
                resultDiv.innerHTML = '<span style="color: var(--color-medium);">⚠️ Please paste or upload some Solidity code to scan.</span>';
                return;
            }

            const scanStages = [
                'Stage 1/4: Static Analysis (Slither, Mythril)',
                'Stage 2/4: Fuzzing & Symbolic Execution (Echion)',
                'Stage 3/4: AI Pattern Matching (DeFi Exploits DB)',
                'Stage 4/4: Security Model Verification'
            ];
            startProgress(scanStages);

            // Simulate the analysis delay
            setTimeout(() => {
                // --- VULNERABILITY SIMULATION CHECKS ---
                
                // 1. Reentrancy (CRITICAL) - Enhanced check for common patterns
                if (code.includes('.call{') && code.match(/call{.*}/) || code.includes('.send(')) {
                    findings.push({
                        line: getLineNumber(code, code.includes('.call{') ? '.call{' : '.send('),
                        type: 'CRITICAL',
                        category: 'Reentrancy',
                        description: 'Potential **Reentrancy Vulnerability** detected (low-level transfer/call).',
                        recommendation: 'Implement the **Checks-Effects-Interactions** pattern or use `ReentrancyGuard`.'
                    });
                }
                
                // 2. Delegatecall (HIGH)
                if (code.includes('delegatecall(')) {
                    findings.push({
                        line: getLineNumber(code, 'delegatecall('),
                        type: 'HIGH',
                        category: 'Logic/Proxy',
                        description: 'Use of **`delegatecall`** is high risk. Could lead to storage collision or unauthorized execution.',
                        recommendation: 'Ensure external logic is trusted and interfaces are strictly defined. Use `call` where possible.'
                    });
                }
                
                // 3. Outdated Pragma (MEDIUM)
                if (code.includes('pragma solidity ^0.4.') || code.includes('pragma solidity ^0.5.') || code.includes('pragma solidity 0.6.')) {
                    findings.push({
                        line: getLineNumber(code, 'pragma solidity'),
                        type: 'MEDIUM',
                        category: 'Compliance',
                        description: 'Outdated **Solidity Pragma** detected. Version 0.8.x offers better overflow protection.',
                        recommendation: 'Update pragma to `pragma solidity ^0.8.0;`.'
                    });
                }
                
                // 4. Gas Optimization / transfer() (LOW)
                if (code.includes('.transfer(')) {
                     findings.push({
                        line: getLineNumber(code, '.transfer('),
                        type: 'LOW',
                        category: 'Gas Optimization',
                        description: 'Use of **`.transfer()`** is deprecated due to gas forwarding limitations (2300 gas).',
                        recommendation: 'Use `.call{value: amount}("")` instead to forward all available gas, but manage reentrancy risk.'
                    });
                }
                
                // 5. Missing Access Control (HIGH) - Catching common initialization patterns
                if (code.includes('function setup()') && !code.includes('onlyOwner') && !code.includes('isInitializer')) {
                     findings.push({
                        line: getLineNumber(code, 'function setup()'),
                        type: 'HIGH',
                        category: 'Access Control',
                        description: 'Missing **Access Control** modifier on a sensitive initialization function (`setup`).',
                        recommendation: 'Apply the `onlyOwner`, `initializer`, or similar access control modifier.'
                    });
                }

                // 6. Hardcoded Gas Limit (LOW) - New check
                 if (code.includes('{gas:')) {
                     findings.push({
                        line: getLineNumber(code, '{gas:'),
                        type: 'LOW',
                        category: 'Gas Optimization',
                        description: 'Hardcoded **gas limit** in low-level call. May fail if gas requirements change.',
                        recommendation: 'Avoid hardcoding gas limits unless absolutely necessary. Rely on default gas forwarding.'
                    });
                }


                // --- RENDER REPORT ---
                findings.sort((a, b) => {
                    // Sorting by severity: CRITICAL (4) > HIGH (3) > MEDIUM (2) > LOW (1)
                    const order = { 'CRITICAL': 4, 'HIGH': 3, 'MEDIUM': 2, 'LOW': 1 };
                    return order[b.type] - order[a.type];
                });

                const highCriticalCount = findings.filter(f => f.type === 'CRITICAL' || f.type === 'HIGH').length;

                if (highCriticalCount > 0) {
                    resultDiv.classList.add('glow-critical'); // Apply glow
                } else {
                    resultDiv.classList.remove('glow-critical');
                }


                if (findings.length > 0) {
                    let summaryClass = highCriticalCount > 0 ? 'CRITICAL' : 'MEDIUM';
                    let icon = highCriticalCount > 0 ? '❌' : '⚠️';
                    
                    let output = `<div class="result-summary ${summaryClass}">
                                    <span class="result-summary-icon">${icon}</span>
                                    **AUDIT ${highCriticalCount > 0 ? 'FAILED' : 'WARNINGS'}**: Found **${findings.length}** issues (**${highCriticalCount}** High/Critical).
                                  </div>`;
                    
                    output += `<table class="vulnerability-table">`;
                    output += `<thead><tr><th>Severity</th><th>Category</th><th>Line</th><th style="width: 40%;">Description</th><th>Recommendation</th></tr></thead><tbody>`;

                    findings.forEach(issue => {
                        output += `<tr>
                            <td><span class="${issue.type}">${issue.type}</span></td>
                            <td>${issue.category}</td>
                            <td>${issue.line}</td>
                            <td>${issue.description}</td>
                            <td><em>${issue.recommendation}</em></td>
                        </tr>`;
                    });
                    output += `</tbody></table>`;
                    
                    resultDiv.innerHTML = output;
                } else {
                    resultDiv.innerHTML = `<div class="result-summary" style="color: var(--color-success);">
                                            <span class="result-summary-icon">✅</span>
                                            **AUDIT PASSED**: No critical vulnerabilities detected by AI.
                                        </div>
                                        <p style="font-size: 0.9em; margin-top: 10px; color: #b3ccff;">
                                        *Note: This simulation provides high confidence, but a final human audit is always recommended for absolute security.</p>`;
                }

                stopProgress();

            }, 3500); // Wait for 3.5 seconds
        }
        
        function generateReport() {
            const highCriticalCount = findings.filter(f => f.type === 'CRITICAL' || f.type === 'HIGH').length;
             // Improved alert for better context
             alert(`💾 Generating comprehensive ${highCriticalCount > 0 ? 'CRITICAL' : 'CLEAN'} PDF report (${findings.length} findings, ~25 pages). Download will begin shortly...`);
        }

        document.addEventListener('DOMContentLoaded', () => {
             // Set default placeholder for filename display
             fileNameDisplay.textContent = 'No file loaded.';
        });

    </script>
</body>
</html>
