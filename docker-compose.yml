version: '3.8'
services:
  mongo:
    image: mongo:5.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./react-app/backend
    volumes:
      - ./react-app/backend:/app
      - ./templates:/app/templates:ro
    environment:
      - FLASK_PORT=5501
      - MONGO_URI=mongodb://mongo:27017/securechain
      - FLASK_SECRET_KEY=a-very-strong-and-long-secret-key-for-production
      - GOOGLE_CLIENT_ID=your-google-client-id-from-env
      - GOOGLE_CLIENT_SECRET=your-google-client-secret-from-env
    ports:
      - "5501:5501"
    healthcheck:
      test: ["CMD-SHELL","curl -f http://127.0.0.1:5501/_debug_info || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
