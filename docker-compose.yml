version: '3.8'
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-securechain}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  ganache:
    image: trufflesuite/ganache:latest
    ports:
      - "8545:8545"
    command: >
      ganache-cli
      -p 8545
      -h 0.0.0.0
      --accounts 10
      --defaultBalanceEther 100
      --deterministic
      --mnemonic "${GANACHE_MNEMONIC:-test test test test test test test test test test test junk}"
    restart: unless-stopped

  backend:
    build: ./react-app/backend
    volumes:
      - ./react-app/backend:/app
      - ./templates:/app/templates:ro
    environment:
      - FLASK_PORT=${FLASK_PORT:-5501}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-securechain}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-change-this-secret}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-your-google-client-id}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-your-google-client-secret}
    ports:
      - "5501:5501"
    healthcheck:
      test: ["CMD-SHELL","curl -f http://127.0.0.1:5501/_debug_info || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  mongo-data:
